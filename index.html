
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Gestione Spese</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/acefede/spese-icon/b552cdaf6bbdbb98f95fe64fe641c4bcb5fe038e/icona.png">
  <link rel="shortcut icon" type="image/png" href="https://raw.githubusercontent.com/acefede/spese-icon/b552cdaf6bbdbb98f95fe64fe641c4bcb5fe038e/icona.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/acefede/spese-icon/b552cdaf6bbdbb98f95fe64fe641c4bcb5fe038e/icona.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gestione Spese">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    #status {
      padding: 24px;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #fff;
    }
  </style>
</head>

<body>
  <div id="status">Preparazione dell'app...</div>

  <iframe
    id="app-frame"
    title="Gestione Spese"
    allow="clipboard-write">
  </iframe>

  <script>
    (() => {
      const status = document.getElementById("status");
      const frame = document.getElementById("app-frame");

      let id;

      try {
        id = decodeURIComponent(
          window.location.hash.slice(1)
        ).trim();
      } catch (error) {
        status.textContent = "Il collegamento non è valido.";
        return;
      }

      if (!id) {
        status.textContent =
          "Manca l'ID della Web App. Apri la pagina con # seguito dall'ID del deployment.";
        return;
      }

      let url;

      if (
        /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec\/?$/.test(id)
      ) {
        url = id;
      } else if (/^[A-Za-z0-9_-]+$/.test(id)) {
        url =
          "https://script.google.com/macros/s/" +
          id +
          "/exec";
      } else {
        status.textContent =
          "ID non valido. Controlla il collegamento della Web App.";
        return;
      }

      status.textContent = "Apertura della tua app...";

      frame.onload = () => {
        status.textContent = "";
        status.style.display = "none";
        frame.style.display = "block";
      };

      frame.src = url;
    })();
  </script>
</body>
</html>
