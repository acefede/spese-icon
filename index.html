<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spese</title>
<link rel="icon" href="icona.png">
<link rel="apple-touch-icon" href="icona.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spese">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light dark}
html,body{margin:0;height:100%;background:#f6f6f6}
@media(prefers-color-scheme:dark){html,body{background:#0e0f10}}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style></head><body>
<iframe id="f" allow="clipboard-write"></iframe>
<script>
(function(){
  var H='6ad420f06c8b19b17f5b2d5458c688b1c95e69e362da5b50a8d8b702a0b13a28';
  var url=decodeURIComponent(location.hash.slice(1)).trim();
  if(!url){ document.body.innerHTML=''; return; }
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(url)).then(function(b){
    var h=Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
    if(h!==H){ document.body.innerHTML=''; return; }
    var ok=false,box=null;
    addEventListener('message',function(e){ if(e.data==='spese-ok'){ ok=true; if(box){box.remove();box=null;} } });
    document.getElementById('f').src=url;
    setTimeout(function(){
      if(ok) return;
      box=document.createElement('div');
      box.style.cssText='position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));background:#fff;color:#222;border-radius:28px;padding:18px;text-align:center;font:16px -apple-system,system-ui,sans-serif;box-shadow:0 6px 24px #0003';
      box.innerHTML='L\u2019app non si apre qui dentro.<br><a href="'+url+'" style="display:block;margin-top:12px;background:#57c696;color:#fff;font-weight:700;padding:14px;border-radius:999px;text-decoration:none">Apri direttamente</a>';
      document.body.appendChild(box);
    },6000);
  });
})();
</script></body></html>
