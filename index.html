
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Spese</title>

  <link rel="icon" href="./icona.png">
  <link rel="apple-touch-icon" href="./icona.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Spese">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f6f6f6;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background: #0e0f10;
      }
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    #status {
      padding: 20px;
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #app-frame {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
      display: none;
      background: transparent;
    }
  </style>
</head>

<body>
  <main id="app">
    <div id="status" role="status">
      Apertura dell'app...
    </div>

    <iframe
      id="app-frame"
      title="App Spese"
      allow="clipboard-write"
      referrerpolicy="no-referrer">
    </iframe>
  </main>

  <script>
    (() => {
      "use strict";

      const status = document.getElementById("status");
      const frame = document.getElementById("app-frame");

      function showError(message) {
        status.textContent = message;
        status.style.display = "block";
        frame.style.display = "none";
        frame.removeAttribute("src");
      }

      function getAppUrl() {
        const fragment = location.hash.slice(1).trim();

        if (!fragment) {
          return null;
        }

        let value;

        try {
          value = decodeURIComponent(fragment);
        } catch {
          throw new Error("Il parametro dell'indirizzo non è valido.");
        }

        if (/^https:\/\//i.test(value)) {
          let parsed;

          try {
            parsed = new URL(value);
          } catch {
            throw new Error("L'indirizzo della Web App non è valido.");
          }

          if (
            parsed.hostname !== "script.google.com" ||
            parsed.pathname.includes("..") ||
            !/^\/macros\/s\/[^/]+\/exec\/?$/.test(parsed.pathname) ||
            parsed.username ||
            parsed.password
          ) {
            );
            throw new Error(
              "Usa un URL HTTPS valido della Web App di Apps Script."
          }

          return parsed.href;
        }

        // Altrimenti il parametro deve essere un ID di deployment.
        if (!/^[A-Za-z0-9_-]+$/.test(value)) {
          throw new Error("L'ID della Web App non è valido.");
        }

        return "https://script.google.com/macros/s/" +
          value + "/exec";
      }

      try {
        const url = getAppUrl();

        if (!url) {
          showError(
            "Manca il collegamento alla Web App. " +
            "Apri la pagina con # seguito dall'ID del deployment."
          );
          return;
        }

        frame.addEventListener("load", () => {
          status.style.display = "none";
          frame.style.display = "block";
        }, { once: true });

        frame.src = url;
      } catch (error) {
        showError(error.message);
      }
    })();
  </script>
</body>
</html>
