<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spese</title>
<link rel="icon" href="icona.png">
<link rel="apple-touch-icon" href="icona.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spese">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light dark}
html,body{margin:0;height:100%;background:#f6f6f6}
@media(prefers-color-scheme:dark){html,body{background:#0e0f10}}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style></head><body>
<iframe id="f" allow="clipboard-write"></iframe>
<script>
// Il link dell'app non è scritto qui e non viene salvato: funziona solo se l'indirizzo contiene #ID.
(function(){
  var id=decodeURIComponent(location.hash.slice(1)).trim();
  if(!id){ document.body.innerHTML=''; return; }
  var url=/^https?:/.test(id)?id:'https://script.google.com/macros/s/'+id+'/exec';
  document.getElementById('f').src=url;
})();
</script></body></html>
